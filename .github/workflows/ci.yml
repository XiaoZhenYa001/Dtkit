name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  desktop-ui:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build frontend
        run: |
          npm ci
          npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install chromium
      - name: Run desktop organizer browser regressions
        run: |
          python tests/desktop-organizer-refactor-ui-smoke.py
          python tests/desktop-app-categories-ui-smoke.py
          python tests/desktop-launcher-ui-smoke.py
          python tests/desktop-launcher-polish-ui-smoke.py
          python tests/desktop-space-settings-ui-smoke.py
          python tests/desktop-space-activation-ui-smoke.py
