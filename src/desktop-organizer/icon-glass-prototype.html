<!doctype html>
<!-- 独立视觉原型：只验证截图中的统一玻璃底板，不接入应用或文件操作。 -->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>统一玻璃底板 · 图标效果预览</title>
  <style>
    :root { color-scheme:dark; font-family:"Segoe UI","Microsoft YaHei",sans-serif; color:#f1f3f7; background:#141516; --muted:#a2a5ab; --line:#ffffff12; --control:#ffffff08; --selected:#ffffff15; --focus:#c6deff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:58px 32px 30px; background:radial-gradient(ellipse at 85% 0%,#2c303043,transparent 50%); }
    button,input { font:inherit; }
    button { color:inherit; cursor:pointer; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--focus); outline-offset:5px; }
    main { width:min(1080px,100%); margin:auto; }
    header { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; margin-bottom:28px; }
    h1 { font-size:25px; line-height:1.35; font-weight:600; letter-spacing:.4px; margin:0 0 9px; }
    header p { color:var(--muted); font-size:13px; line-height:1.7; margin:0; }
    .controls { display:flex; align-items:center; gap:18px; flex-shrink:0; padding-bottom:3px; }
    .themes { display:flex; gap:3px; border:1px solid var(--line); border-radius:11px; padding:4px; background:var(--control); }
    .themes button { border:0; padding:7px 13px; border-radius:7px; background:transparent; color:var(--muted); font-size:12px; white-space:nowrap; }
    .themes button[aria-pressed=true] { background:var(--selected); color:inherit; box-shadow:0 1px 4px #0001; }
    .plate-toggle { display:flex; align-items:center; gap:9px; font-size:12px; cursor:pointer; white-space:nowrap; }
    .plate-toggle input { appearance:none; -webkit-appearance:none; width:30px; height:18px; margin:0; background:#55585c; border-radius:20px; cursor:pointer; position:relative; }
    .plate-toggle input::after { content:""; position:absolute; top:3px; left:3px; width:12px; height:12px; background:#fff; border-radius:50%; transition:transform 150ms ease; box-shadow:0 1px 2px #0003; }
    .plate-toggle input:checked { background:#779b8c; }
    .plate-toggle input:checked::after { transform:translateX(12px); }
    .desktop { position:relative; isolation:isolate; overflow:hidden; border-radius:26px; padding:22px 38px 38px; border:1px solid #ffffff14; background:radial-gradient(ellipse at 0% -10%,#6672753d,transparent 52%),radial-gradient(ellipse at 105% 100%,#535b5d38,transparent 42%),linear-gradient(145deg,#252728,#1b1d1e 62%,#242728); box-shadow:0 24px 72px #0003,inset 0 1px 0 #ffffff08; }
    .desktop-head { display:flex; align-items:center; justify-content:space-between; gap:18px; color:#aeb2b7; font-size:11px; line-height:20px; margin-bottom:28px; }
    .desktop-title { display:flex; align-items:center; gap:10px; }
    .desktop-mark { width:14px; height:12px; border:1px solid currentColor; border-radius:3px; opacity:.8; position:relative; }
    .desktop-mark::after { content:""; position:absolute; left:3px; top:3px; bottom:3px; border-left:1px solid currentColor; }
    .measure { color:#9ca1a8; font-variant-numeric:tabular-nums; }
    .group + .group { margin-top:22px; padding-top:23px; border-top:1px solid #ffffff0c; }
    h2 { margin:0 0 13px; color:#a6abb2; font-size:11px; font-weight:500; letter-spacing:1px; }
    .grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; }
    .item { display:flex; flex-direction:column; align-items:center; gap:15px; min-width:0; padding:12px 5px 13px; border:0; border-radius:16px; background:transparent; position:relative; user-select:none; -webkit-tap-highlight-color:transparent; }
    .item::before { content:""; position:absolute; inset:0; border-radius:inherit; border:1px solid transparent; transition:background 150ms,border-color 150ms; pointer-events:none; }
    .item[aria-pressed=true]::before { background:#ffffff07; border-color:#ffffff18; }
    .shell { width:80px; height:80px; display:grid; place-items:center; position:relative; isolation:isolate; border-radius:22.4px; flex-shrink:0;
      background:linear-gradient(155deg,#f4faff29,#d1e3fc12 65%,#ffffff20);
      box-shadow:inset 0 1px 1px #ffffff59,inset 0 -1px 1px #0208121c,0 4px 8px #01071324;
      transition:transform 180ms cubic-bezier(.2,.7,.2,1);
    }
    .shell::after { content:""; position:absolute; inset:.5px; border-radius:inherit; box-shadow:inset 0 0 0 1px #ffffff12; pointer-events:none; }
    .shell::before { content:""; position:absolute; inset:0; border-radius:inherit; background:linear-gradient(155deg,#fff1,#fff0 70%); opacity:0; pointer-events:none; transition:opacity 180ms ease; }
    .item:hover .shell { transform:translateY(-2px); }
    .item:hover .shell::before { opacity:1; }
    .item:active .shell { transform:scale(.965); transition-duration:90ms; }
    .artwork { display:block; position:relative; width:52px; height:52px; object-fit:contain; pointer-events:none; }
    .link-art { width:64px; height:64px; color:#eff6ff; }
    .name { position:relative; max-width:100%; font-size:13px; line-height:1.5; font-weight:400; color:#f0f1f4; overflow-wrap:anywhere; min-height:20px; text-shadow:0 1px 2px #0004; }
    .desktop[data-plates=false] .shell { background:transparent; box-shadow:none; }
    .desktop[data-plates=false] .shell::before,.desktop[data-plates=false] .shell::after { display:none; }
    footer { display:flex; align-items:center; justify-content:space-between; gap:18px; color:var(--muted); margin-top:20px; font-size:11px; line-height:1.6; }
    #selection { color:var(--muted); }
    [data-theme=light] { color-scheme:light; color:#242b32; background:#eeefef; --muted:#717981; --line:#19253118; --control:#ffffff68; --selected:#fff; --focus:#486a8f; }
    [data-theme=light] body { background:radial-gradient(ellipse at 85% 0%,#d2dadb75,transparent 50%); }
    [data-theme=light] .desktop { background:radial-gradient(ellipse at 0% 0%,#fff9,transparent 55%),radial-gradient(ellipse at 105% 110%,#a5b3b82e,transparent 46%),linear-gradient(145deg,#c5ccce,#b5bec1 62%,#ced4d5); border-color:#ffffff80; box-shadow:0 24px 72px #18293218,inset 0 1px 0 #fff8; }
    [data-theme=light] .desktop-head,[data-theme=light] h2 { color:#4f5d66; }
    [data-theme=light] .measure { color:#5b6870; }
    [data-theme=light] .group + .group { border-color:#30475414; }
    [data-theme=light] .name { color:#26343c; text-shadow:0 1px 1px #fff4; }
    [data-theme=light] .link-art { color:#425363; }
    [data-theme=light] .item[aria-pressed=true]::before { background:#ffffff18; border-color:#354b602a; }
    @media(max-width:820px) { body { padding:32px 22px; } header { align-items:flex-start; flex-direction:column; gap:20px; } .controls { width:100%; justify-content:space-between; } .desktop { padding:22px; } .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px 8px; } .desktop-head { margin-bottom:23px; } }
    @media(max-width:440px) { body { padding:26px 14px; } h1 { font-size:22px; } .desktop { padding:18px 9px 22px; border-radius:20px; } .desktop-head,h2 { margin-left:10px; margin-right:10px; } .measure { display:none; } .grid { gap:9px 2px; } .item { gap:13px; padding:10px 2px 12px; } .name { font-size:11px; } footer { align-items:flex-start; flex-direction:column; gap:6px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; } }
  </style>
</head>

  <main>
    <header>
      <div><h1>给原来的图标，加同一层玻璃。</h1><p>沿用参考图的底板与边框，保留软件、文件和文件夹的原始图案。</p></div>
      <div class="controls">
        <div class="themes" role="group" aria-label="桌面背景"><button type="button" data-theme-button="dark" aria-pressed="true">深色</button><button type="button" data-theme-button="light" aria-pressed="false">浅色</button></div>
        <label class="plate-toggle"><input id="plates" type="checkbox" checked>玻璃底板</label>
      </div>
    </header>
    <section class="desktop" id="desktop" data-plates="true" aria-label="图标效果演示">
      <div class="desktop-head"><span class="desktop-title"><span class="desktop-mark" aria-hidden="true"></span>桌面空间 · 视觉示例</span><span class="measure">80 px 底板 · 52 px 原图</span></div>
      <section class="group" aria-labelledby="apps-heading"><h2 id="apps-heading">软件</h2><div class="grid" id="apps"></div></section>
      <section class="group" aria-labelledby="files-heading"><h2 id="files-heading">文件与文件夹</h2><div class="grid" id="files"></div></section>
    </section>
    <footer><span>悬停查看高光，点击选中；关闭「玻璃底板」可对比原始图标。</span><span id="selection" role="status" aria-live="polite">独立 HTML 预览</span></footer>

  <script>
    const icons = JSON.parse(document.getElementById('native-icons').textContent);
    const items = {
      apps:[['chrome','Google Chrome'],['edge','Microsoft Edge'],['everything','Everything'],['sevenzip','7-Zip'],['notepad','记事本'],['dtkit','DtKit']],
      files:[['folder','工作资料'],['text','项目说明.txt'],['pdf','设计方案.pdf'],['archive','文件归档.zip'],['picture','参考图片.png'],['link','Riders Republic.url']]
    };
    for (const [group, entries] of Object.entries(items)) {
      for (const [key, name] of entries) {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'item'; button.setAttribute('aria-pressed','false');
        const shell = document.createElement('span'); shell.className = 'shell';
        if (key === 'link') {
          shell.innerHTML = '<svg class="artwork link-art" viewBox="0 0 64 64" aria-hidden="true"><path d="m26 36 12-12m-16 6-3 3a9 9 0 0 0 13 13l6-6m4-10 3-3a9 9 0 0 0-13-13l-6 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>';
        } else {
          const image = document.createElement('img'); image.src = icons[key]; image.alt = ''; image.className = 'artwork'; image.draggable = false; shell.append(image);
        }
        const label = document.createElement('span'); label.className = 'name'; label.textContent = name;
        button.append(shell,label); document.getElementById(group).append(button);
        button.addEventListener('click', () => {
          document.querySelectorAll('.item[aria-pressed="true"]').forEach(item => item.setAttribute('aria-pressed','false'));
          button.setAttribute('aria-pressed','true'); document.getElementById('selection').textContent = `已选中 · ${name}`;
        });
      }
    }
    document.querySelectorAll('[data-theme-button]').forEach(button => button.addEventListener('click', () => {
      document.documentElement.dataset.theme = button.dataset.themeButton;
      document.querySelectorAll('[data-theme-button]').forEach(item => item.setAttribute('aria-pressed',String(item === button)));
    }));
    document.getElementById('plates').addEventListener('change', event => {
      document.getElementById('desktop').dataset.plates = String(event.target.checked);
      document.getElementById('selection').textContent = event.target.checked ? '已显示统一玻璃底板' : '原始图标 · 未修改图案';
    });
  </script>
</body>
</html>
