<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DToolBox - 桌面工具箱</title>
    
    <!-- 本地图标库（替代 RemixIcon CDN） -->
    <link rel="stylesheet" href="assets/icons.css">
    
    <!-- 基础样式 -->
    <link rel="stylesheet" href="css/base.css">
    <!-- 布局样式 -->
    <link rel="stylesheet" href="css/layout.css">
    <!-- 工具库样式 -->
    <link rel="stylesheet" href="css/tools-library.css">
    <!-- 设置页面样式 -->
    <link rel="stylesheet" href="css/settings.css">
    <!-- 工具样式 -->
    <link rel="stylesheet" href="css/tools/timestamp-converter.css">
    <link rel="stylesheet" href="css/tools/json-formatter.css">
    <link rel="stylesheet" href="css/tools/base64-codec.css">
    <!-- 响应式设计 -->
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- 侧边栏导航 -->
    <aside class="sidebar">
        <div class="sidebar-logo">DT</div>

        <nav class="sidebar-nav">
            <button class="nav-btn nav-btn--active" data-view="toolLibrary" title="工具库">
                <div class="nav-btn__icon">
                    <i class="ri-apps-2-line"></i>
                </div>
                <span class="nav-btn__label">工具库</span>
            </button>

            <button class="nav-btn" data-view="favorites" title="收藏">
                <div class="nav-btn__icon">
                    <i class="ri-star-line"></i>
                </div>
                <span class="nav-btn__label">收藏</span>
            </button>

            <button class="nav-btn" data-view="history" title="暂时不知道是什么">
                <div class="nav-btn__icon">
                    <i class="ri-history-line"></i>
                </div>
                <span class="nav-btn__label">暂定</span>
            </button>
        </nav>

        <button class="nav-btn nav-settings" data-view="settings" title="设置">
            <div class="nav-btn__icon">
                <i class="ri-settings-3-line"></i>
            </div>
        </button>
    </aside>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 标签栏 -->
        <div class="tab-container">
            <div id="tabBar" class="tab-bar">
                <!-- 标签页动态生成 -->
            </div>
            <button id="addTabBtn" class="tab-add-btn" title="新增标签页">
                <i class="ri-add-line"></i>
            </button>
        </div>

        <!-- 主内容区域 -->
        <main id="contentArea" class="content-area">
            
            <!-- 导航栏（搜索 + 后退前进） -->
            <div class="navbar">
                <div class="navbar__nav-buttons">
                    <button id="backBtn" class="nav-btn-icon" title="返回上一步">
                        <i class="ri-arrow-left-s-line"></i>
                    </button>
                    <button id="forwardBtn" class="nav-btn-icon" title="前进到下一步">
                        <i class="ri-arrow-right-s-line"></i>
                    </button>
                </div>
                
                <div id="searchContainer" class="search-container">
                    <i class="ri-search-2-line"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="筛选工具..."
                    >
                </div>
            </div>

            <!-- 工具库视图 -->
            <div id="toolLibraryView" class="view view--active">
                <div class="view-container">
                    <!-- 开发工具分类 -->
                    <div class="tools-category">
                        <h2 class="section-title">开发工具</h2>
                        <div class="tool-grid" id="devToolsGrid">
                            <!-- 工具卡片动态生成 -->
                        </div>
                    </div>

                    <!-- 设计工具分类 -->
                    <div class="tools-category">
                        <h2 class="section-title">设计工具</h2>
                        <div class="tool-grid" id="designToolsGrid">
                            <!-- 工具卡片动态生成 -->
                        </div>
                    </div>

                    <!-- 其他工具分类 -->
                    <div class="tools-category">
                        <h2 class="section-title">其他工具</h2>
                        <div class="tool-grid" id="otherToolsGrid">
                            <!-- 工具卡片动态生成 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- 动态工具容器 - 工具视图会动态渲染到这里 -->
            <div id="dynamicToolContainer" class="view">
                <!-- 工具内容由 JavaScript 动态注入 -->
            </div>

            <!-- 收藏夹视图 -->
            <div id="favoritesView" class="view">
                <div class="view-container">
                    <div class="favorites-header">
                        <h2 class="section-title">我的收藏</h2>
                        <button id="clearFavoritesBtn" class="btn btn--secondary favorites__clear-btn">
                            <i class="ri-delete-bin-line"></i> 清空全部
                        </button>
                    </div>
                    <div class="tool-grid" id="favoritesGrid">
                        <!-- 收藏工具卡片动态生成 -->
                    </div>
                </div>
            </div>

            <!-- 设置视图 -->
            <div id="settingsView" class="view">
                <div class="view-container">
                    <div class="settings-content">
                        
                        <!-- 存储与网络 -->
                        <section class="settings-section">
                            <div class="settings-section-header">
                                <i class="ri-hard-drive-2-line"></i>
                                <h2 class="settings-section-title">存储与网络</h2>
                            </div>
                            <div class="settings-section-content">
                                
                                <div class="settings-item">
                                    <label class="settings-label">文件下载位置</label>
                                    <div class="settings-input-group">
                                        <input type="text" id="downloadPathInput" class="settings-input" placeholder="输入下载路径...">
                                        <div class="settings-btn-group">
                                            <button id="changeDownloadPathBtn" class="settings-btn settings-btn--secondary">更改目录</button>
                                            <button id="browseDownloadPathBtn" class="settings-btn-icon" title="选择文件夹">
                                                <i class="ri-folder-open-line"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div class="settings-checkbox">
                                        <input type="checkbox" id="clean-files" class="checkbox">
                                        <label for="clean-files" class="checkbox-label">退出时自动清理临时文件</label>
                                    </div>
                                </div>

                                <hr class="settings-divider">

                                <div class="settings-item">
                                    <div class="settings-item-header">
                                        <label class="settings-label">工具资源镜像源 (Mirror Source)</label>
                                        <span class="settings-status-badge"><i class="ri-wifi-line"></i> 24ms</span>
                                    </div>
                                    <div class="settings-input-group">
                                        <select class="settings-select">
                                            <option value="official">官方源 (Default)</option>
                                            <option value="aliyun" selected>阿里云 (Aliyun Mirror)</option>
                                            <option value="tencent">腾讯云 (Tencent Mirror)</option>
                                            <option value="custom">自定义...</option>
                                        </select>
                                        <button class="settings-btn settings-btn--secondary">
                                            <i class="ri-speed-line"></i> 测速
                                        </button>
                                    </div>
                                    <p class="settings-help-text">用于加速 NPM 包、图片资源及插件的下载。</p>
                                </div>
                            </div>
                        </section>

                        <!-- 快捷键绑定 -->
                        <section class="settings-section">
                            <div class="settings-section-header">
                                <i class="ri-keyboard-box-line"></i>
                                <h2 class="settings-section-title">快捷键绑定</h2>
                                <span class="settings-section-hint">双击键位可修改</span>
                            </div>
                            <div class="settings-section-content" id="shortcutBindings">
                                <div class="settings-shortcut-item" data-shortcut-id="toggleApp" data-default="Alt+Space">
                                    <span class="settings-shortcut-label">呼出/隐藏工具箱</span>
                                    <div class="settings-shortcut-keys">
                                        <span class="settings-key">Alt</span> <span class="settings-key-plus">+</span> <span class="settings-key">Space</span>
                                    </div>
                                </div>
                                <div class="settings-shortcut-item" data-shortcut-id="screenshot" data-default="Ctrl+F1">
                                    <span class="settings-shortcut-label">截图</span>
                                    <div class="settings-shortcut-keys">
                                        <span class="settings-key">Ctrl</span> <span class="settings-key-plus">+</span> <span class="settings-key">F1</span>
                                    </div>
                                </div>
                                <div class="settings-shortcut-item" data-shortcut-id="colorPicker" data-default="Ctrl+Shift+C">
                                    <span class="settings-shortcut-label">截图并提取颜色</span>
                                    <div class="settings-shortcut-keys">
                                        <span class="settings-key">Ctrl</span> <span class="settings-key-plus">+</span> <span class="settings-key">Shift</span> <span class="settings-key-plus">+</span> <span class="settings-key">C</span>
                                    </div>
                                </div>
                                <div class="settings-shortcut-item" data-shortcut-id="recentTool" data-default="Ctrl+E">
                                    <span class="settings-shortcut-label">打开最近使用的工具</span>
                                    <div class="settings-shortcut-keys">
                                        <span class="settings-key">Ctrl</span> <span class="settings-key-plus">+</span> <span class="settings-key">E</span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- 配置规则管理 -->
                        <section class="settings-section">
                            <div class="settings-section-header">
                                <i class="ri-database-2-line"></i>
                                <h2 class="settings-section-title">配置规则管理</h2>
                            </div>
                            <div class="settings-section-content">
                                
                                <div class="settings-item">
                                    <div>
                                        <div class="settings-item-title">备份配置</div>
                                        <div class="settings-item-desc">导出所有工具设置、快捷键及收藏列表</div>
                                    </div>
                                    <button class="settings-btn settings-btn--primary">
                                        <i class="ri-upload-2-line"></i> 导出 Config.json
                                    </button>
                                </div>
                                
                                <hr class="settings-divider">
                                
                                <div class="settings-item">
                                    <div>
                                        <div class="settings-item-title">导入配置</div>
                                        <div class="settings-item-desc">从 JSON 文件恢复设置，这将覆盖当前配置</div>
                                    </div>
                                    <button class="settings-btn settings-btn--secondary">
                                        <i class="ri-download-2-line"></i> 导入...
                                    </button>
                                </div>
                            </div>
                        </section>

                        <!-- 常规选项 -->
                        <section class="settings-section">
                            <div class="settings-section-header">
                                <i class="ri-toggle-line"></i>
                                <h2 class="settings-section-title">常规选项</h2>
                            </div>
                            <div class="settings-section-content">
                                <div class="settings-toggle-item">
                                    <span class="settings-toggle-label">开机自动启动</span>
                                    <label class="settings-toggle">
                                        <input type="checkbox" class="settings-toggle-input">
                                        <span class="settings-toggle-slider"></span>
                                    </label>
                                </div>
                                <div class="settings-toggle-item">
                                    <span class="settings-toggle-label">关闭主面板时最小化到托盘</span>
                                    <label class="settings-toggle">
                                        <input type="checkbox" class="settings-toggle-input" checked>
                                        <span class="settings-toggle-slider"></span>
                                    </label>
                                </div>
                            </div>
                        </section>

                        <div class="settings-footer">
                            <p>DtKit v0.1.0 • Build 20241218</p>
                        </div>

                    </div>
                </div>
            </div>

        </main>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
