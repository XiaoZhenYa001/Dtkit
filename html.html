<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝白桌面工具箱原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* 自定义滚动条样式 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex overflow-hidden text-slate-700">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <span class="font-bold text-lg text-slate-800">DevToolbox</span>
        </div>

        <div class="p-4">
            <div class="relative">
                <input type="text" placeholder="搜索工具..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-3 space-y-1">
            <div class="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">常用工具</div>
            
            <a href="#" class="flex items-center px-3 py-2.5 bg-blue-50 text-blue-700 rounded-lg group transition-colors">
                <svg class="w-5 h-5 mr-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="font-medium">时间戳转换</span>
            </a>

            <a href="#" class="flex items-center px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg group transition-colors">
                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                <span class="font-medium">JSON 格式化</span>
            </a>

            <a href="#" class="flex items-center px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg group transition-colors">
                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                <span class="font-medium">颜色提取器</span>
            </a>

            <div class="px-3 py-2 mt-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">编码与加密</div>
            <a href="#" class="flex items-center px-3 py-2.5 text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg group transition-colors">
                <svg class="w-5 h-5 mr-3 text-slate-400 group-hover:text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <span class="font-medium">Base64 / MD5</span>
            </a>
        </nav>
        
        <div class="p-4 border-t border-slate-200">
            <button class="flex items-center w-full px-2 py-2 text-sm font-medium text-slate-600 rounded-lg hover:bg-slate-50 transition-colors">
                <svg class="w-5 h-5 mr-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                全局设置
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 bg-slate-50">
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-8">
            <h1 class="text-xl font-bold text-slate-800">时间戳转换工具</h1>
            <div class="text-sm text-slate-400">v1.0.0</div>
        </header>

        <div class="flex-1 p-8 overflow-y-auto">
            <div class="max-w-4xl mx-auto space-y-6">
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex items-center justify-between">
                    <div>
                        <div class="text-sm font-medium text-slate-400 mb-1">当前系统时间</div>
                        <div class="text-3xl font-mono text-blue-600 font-bold">1716358290</div>
                    </div>

                </div>

                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8">
                    
                    <div class="mb-8">
                        <label class="block text-sm font-medium text-slate-700 mb-2">Unix 时间戳 (秒/毫秒)</label>
                        <div class="flex space-x-4">
                            <input type="text" value="1716358290" class="flex-1 block w-full rounded-lg border-slate-300 bg-slate-50 border p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm font-mono" placeholder="输入时间戳...">
                            <button class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-sm transition-colors flex items-center">
                                转换 <span class="ml-2">→</span>
                            </button>
                            <input type="text" readonly value="2024-05-22 14:11:30" class="flex-1 block w-full rounded-lg border-slate-200 bg-white border p-3 text-slate-500 font-mono cursor-not-allowed">
                        </div>
                    </div>

                    <div class="border-t border-slate-100 my-8"></div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">时间 (Date)</label>
                        <div class="flex space-x-4">
                            <input type="text" value="2024-05-22 14:11:30" class="flex-1 block w-full rounded-lg border-slate-300 bg-slate-50 border p-3 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm font-mono">
                            <button class="px-6 py-3 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg font-medium shadow-sm transition-colors flex items-center">
                                转换 <span class="ml-2">→</span>
                            </button>
                            <input type="text" readonly value="1716358290" class="flex-1 block w-full rounded-lg border-slate-200 bg-white border p-3 text-slate-500 font-mono cursor-not-allowed">
                        </div>
                    </div>

                </div>

                <div class="text-sm text-slate-500 bg-blue-50 border border-blue-100 rounded-lg p-4">
                    <p><strong>💡 提示：</strong> 自动识别秒（10位）和毫秒（13位）。支持复制和粘贴格式化。</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
